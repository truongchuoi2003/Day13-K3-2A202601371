alerts:
  - name: API P95 latency vượt SLO
    severity: critical
    condition: latency_p95_ms > 3000 trong 5 phút liên tiếp
    type: symptom-based
    owner: Dashboard, SLO & Alert
    runbook: docs/alerts.md#alert-1
  - name: Tỷ lệ lỗi request vượt SLO
    severity: critical
    condition: error_rate_pct > 2 trong 5 phút liên tiếp
    type: symptom-based
    owner: Dashboard, SLO & Alert
    runbook: docs/alerts.md#alert-2
  - name: Chi phí request vượt ngân sách ngày
    severity: warning
    condition: daily_cost_usd > 2.5 trong 15 phút liên tiếp
    type: symptom-based
    owner: Dashboard, SLO & Alert
    runbook: docs/alerts.md#alert-3
